<!DOCTYPE html>

<head>

<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#061a47"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Mita N5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Tiếng Nhật N5 – Ôn thi</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#eaf2ff;--mute:#9db4d8;--ok:#6ee7b7;--bad:#fda4af}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.6 'Be Vietnam Pro','Zen Maru Gothic',sans-serif;
background:transparent}
#app{max-width:980px;margin:0 auto;padding:28px 18px 60px}
.jp{font-family:'Zen Maru Gothic','Be Vietnam Pro',sans-serif}
h1{font-size:2.6rem;margin:.4em 0 0}h2{margin:.2em 0 .6em}
.sub{color:var(--mute);margin:0 0 28px}
.glass,button{background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.04));backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);
border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.07),0 10px 30px rgba(0,0,0,.35);border-radius:20px;color:var(--ink)}
button{font:inherit;padding:10px 20px;cursor:pointer;border-radius:999px;transition:background .2s,transform .1s}
button:hover{background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.08))}
button:active{transform:scale(.97)}button:focus-visible,input:focus-visible{outline:2px solid #7cc4ff;outline-offset:2px}
button.on{background:linear-gradient(135deg,rgba(124,196,255,.45),rgba(124,196,255,.12))}
.grid{display:grid;gap:18px}
.big{padding:34px 24px;font-size:1.3rem;border-radius:26px;text-align:left}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.panel{padding:20px;margin:16px 0}
.kt{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:520px}
.kt div{padding:8px 0;text-align:center;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
.kt b{display:block;font-size:1.6rem;font-weight:700}.kt small{color:var(--mute)}
.kt .e{visibility:hidden}
.stage{text-align:center;padding:40px 20px}
.q{font-size:8rem;line-height:1.1;margin:10px 0 24px}
input{font:inherit;font-size:1.5rem;text-align:center;width:min(320px,90%);padding:12px;border-radius:16px;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.28)}
.fb{min-height:2em;margin-top:14px;font-size:1.1rem}.good{color:var(--ok)}.wrong{color:var(--bad)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{padding:18px}.card .w{font-size:1.8rem;font-weight:700}.card .m{color:var(--mute);margin-bottom:8px}
.card p{margin:6px 0;padding-left:12px;border-left:2px solid rgba(124,196,255,.5)}.card p small{display:block;color:var(--mute)}
.say{padding:2px 10px;margin-left:8px;font-size:.9rem}
.txt{font-size:1.7rem;line-height:2.4;padding:28px}rt{font-size:.5em;color:var(--mute)}
.clock{font-size:4rem;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;margin:8px 0}
@media(max-width:560px){.q{font-size:5.5rem}h1{font-size:2rem}.txt{font-size:1.3rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
body{overflow-x:hidden}
#app.wide{max-width:none;padding:0}
.hero{position:relative;width:100%;min-height:100vh;overflow:hidden;padding:28px clamp(18px,5vw,64px) 48px;display:flex;flex-direction:column}
.nav{position:relative;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.6rem}.logo i{display:inline-block;width:.32em;height:.32em;border-radius:50%;background:#ef3b4a;margin-left:3px}
.links{display:flex;gap:4px;padding:5px;border-radius:999px;flex-wrap:wrap}
.links button{background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:8px 16px}
.links button:hover{background:rgba(255,255,255,.18)}
.tag{position:relative;z-index:2;display:flex;justify-content:space-between;gap:20px;margin-top:34px;font-size:.95rem;color:var(--mute)}
.mid{position:relative;z-index:2;margin:auto 0;padding-top:4vh}
.ttl{font-size:clamp(3rem,12.5vw,12rem);line-height:1;letter-spacing:-.035em;font-weight:800;margin:0}
.sj{font-size:clamp(1.1rem,2.6vw,2rem);margin:18px 0 28px}
.cta{font-size:1.2rem;padding:16px 36px}
.st{position:absolute;z-index:1;width:var(--s);height:auto;pointer-events:none;filter:drop-shadow(0 14px 18px rgba(0,0,0,.45));animation:fl var(--d) ease-in-out var(--dl) infinite alternate}
.st.f{z-index:3}
@keyframes fl{from{transform:translate(0,0) rotate(var(--r0))}to{transform:translate(var(--dx),var(--dy)) rotate(var(--r1))}}
@media(prefers-reduced-motion:reduce){.st{animation:none}}
button{touch-action:manipulation}
#app{padding-top:max(28px,calc(env(safe-area-inset-top) + 16px));padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right));padding-bottom:max(60px,calc(env(safe-area-inset-bottom) + 40px))}
#app.wide{padding:0}
.hero{padding-top:max(28px,calc(env(safe-area-inset-top) + 16px));padding-left:max(clamp(18px,5vw,64px),env(safe-area-inset-left));padding-right:max(clamp(18px,5vw,64px),env(safe-area-inset-right));padding-bottom:max(48px,calc(env(safe-area-inset-bottom) + 32px))}
@media(pointer:coarse){button{min-height:48px;padding:12px 22px}.say{min-height:44px;min-width:48px}.links button{padding:12px 16px}.kt div{padding:12px 0}input{font-size:1.6rem;padding:14px}.big{min-height:96px}}
.prog p{margin:4px 0;color:var(--mute)}.prog b{color:var(--ink)}
.dt{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.dt div{padding:8px 10px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);text-align:center}.dt b{display:block;color:var(--mute);font-weight:600;font-size:.85rem}
.ref p{margin:6px 0}
html{background:#061a47;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overscroll-behavior:none}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100vh;height:100lvh;z-index:-1;
background:radial-gradient(60% 40% at 20% 85%,#0b5bb0 0,transparent 70%),radial-gradient(50% 40% at 85% 20%,#10316e 0,transparent 70%),linear-gradient(180deg,#02060f,#061a47 60%,#0a3a85)}
.hero{min-height:100vh;min-height:100dvh}
.ttl{line-height:1.08}
.txt{font-size:clamp(1.15rem,3.6vw,1.5rem);line-height:2.3}
.ro{margin-top:16px;font-family:'Be Vietnam Pro',sans-serif;font-size:.95rem;line-height:1.7;opacity:.45}.ro.off{display:none}
textarea{font:inherit;width:100%;padding:12px;border-radius:16px;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.28);resize:vertical}
.pi{border-top:1px solid rgba(255,255,255,.12);padding-top:8px}.pt small{color:var(--mute)}
</style>
</head>
<body>
<main id="app"></main>
<script>
const app=document.getElementById('app');
const back='<button onclick="home()">← Menu</button>';
let T={id:0};
const load=()=>{try{return JSON.parse(localStorage.getItem('mita'))||{}}catch{return{}}};
const upd=f=>{try{const o=load();f(o);localStorage.setItem('mita',JSON.stringify(o))}catch{}};
let WL=null;
async function lock(){try{WL=await navigator.wakeLock.request('screen')}catch{}}
function unlock(){try{WL&&WL.release()}catch{}WL=null}
function show(h,wide){clearInterval(T.id);unlock();app.className=wide?'wide':'';app.innerHTML=h;scrollTo(0,0)}
function say(t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.85;speechSynthesis.speak(u)}
const rb=s=>s.replace(/([\u4e00-\u9fff]+)\{([^}]+)\}/g,'<ruby>$1<rt>$2</rt></ruby>');

function home(){const o=load(),q=o.q,sp=o.s,v=o.v,L=[];
if(q&&q.n)L.push(`Quiz chữ cái: <b>${q.ok}/${q.n}</b> đúng (${Math.round(q.ok*100/q.n)}%)`);
const wk=Object.keys(q?q.w||{}:{});if(wk.length)L.push(`Chữ hay sai: <b class="jp">${wk.slice(0,8).join(' ')}</b>`);
if(o.c&&o.c.n)L.push(`Luyện đếm số: <b>${o.c.ok}/${o.c.n}</b> đúng`);
if(sp&&sp.n)L.push(`Luyện nói: <b>${sp.n}</b> lần, tổng <b>${mmss(sp.t)}</b>`);
show(`<div class="row"><button onclick="landing()">← Trang đầu</button></div><h1 class="jp">日本語 N5</h1><p class="sub">Ôn thi theo đúng tài liệu bài 1 – 3</p>
<div class="grid">
${v&&D[v.n]&&D[v.n][v.i]?`<button class="glass big" onclick="V={n:${v.n},i:${v.i}};lesson()">Tiếp tục: bài ${v.n}, ${D[v.n][v.i][0]}</button>`:''}
<button class="glass big" onclick="kana()">Bảng chữ cái</button>
<button class="glass big" onclick="vocab()">Từ vựng</button>
<button class="glass big" onclick="speak()">Luyện nói với đoạn văn</button>
<button class="glass big" onclick="counter()">Luyện đếm số</button></div>
${L.length?`<div class="glass panel prog"><h3>Tiến độ (lưu trên máy này)</h3>${L.map(x=>`<p>${x}</p>`).join('')}<div class="row"><button onclick="if(confirm('Xóa toàn bộ tiến độ?')){try{localStorage.removeItem('mita')}catch{}home()}">Xóa tiến độ</button></div></div>`:''}`)}

/* ---------- 1. CHỮ CÁI ---------- */
const R=[["あいうえお","a i u e o"],["かきくけこ","ka ki ku ke ko"],["さしすせそ","sa shi su se so"],["たちつてと","ta chi tsu te to"],["なにぬねの","na ni nu ne no"],["はひふへほ","ha hi fu he ho"],["まみむめも","ma mi mu me mo"],["や　ゆ　よ","ya - yu - yo"],["らりるれろ","ra ri ru re ro"],["わ　　　を","wa - - - wo"],["ん　　　　","n - - - -"],["がぎぐげご","ga gi gu ge go"],["ざじずぜぞ","za ji zu ze zo"],["だぢづでど","da ji zu de do"],["ばびぶべぼ","ba bi bu be bo"],["ぱぴぷぺぽ","pa pi pu pe po"]];
const K=s=>[...s].map(c=>c>='ぁ'&&c<='ゖ'?String.fromCharCode(c.charCodeAt(0)+96):c).join('');
const ALT={shi:['si'],chi:['ti'],tsu:['tu'],fu:['hu'],ji:['zi','di'],zu:['du'],wo:['o'],n:['nn']};
const POOL=[];R.forEach(([k,r])=>{const rr=r.split(' ');[...k].forEach((c,i)=>{if(c!=='　')POOL.push({h:c,k:K(c),r:rr[i]})})});
function table(conv){return '<div class="kt jp">'+R.map(([k,r])=>{const rr=r.split(' ');return [...k].map((c,i)=>c==='　'?'<div class="e">.</div>':`<div><b>${conv(c)}</b><small>${rr[i]}</small></div>`).join('')}).join('')+'</div>'}
function kana(){show(`${back}<h2>Bảng chữ cái</h2>
<div class="glass panel"><h3>Hiragana (ひらがな)</h3>${table(c=>c)}</div>
<div class="glass panel"><h3>Katakana (カタカナ)</h3>${table(K)}</div>
<div class="row"><button class="on" onclick="quiz()">Ghi nhớ chữ cái</button></div>`)}
let Q={set:'both',mode:0,cur:null,ok:0,n:0,wait:false};
function quiz(){Q.ok=Q.n=0;drawQ();nextQ()}
function drawQ(){show(`<div class="row"><button onclick="kana()">← Bảng chữ cái</button>
<button class="${Q.set=='h'?'on':''}" onclick="Q.set='h';drawQ();nextQ()">Hiragana</button>
<button class="${Q.set=='k'?'on':''}" onclick="Q.set='k';drawQ();nextQ()">Katakana</button>
<button class="${Q.set=='both'?'on':''}" onclick="Q.set='both';drawQ();nextQ()">Cả hai</button>
<button class="${Q.mode?'on':''}" onclick="Q.mode=1-Q.mode;drawQ();nextQ()">${Q.mode?'Đề: romaji → gõ kana':'Đề: kana → gõ romaji'}</button></div>
<div class="glass stage"><div class="q jp" id="qc"></div>
<input id="qa" lang="${Q.mode?'ja':'vi'}" enterkeyhint="done" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${Q.mode?'Gõ chữ kana (bật bộ gõ tiếng Nhật)':'Gõ romaji, ví dụ: ka'}">
<div class="fb" id="fb"></div><p class="sub" id="sc"></p></div>`);
document.getElementById('qa').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)submitQ()})}
function nextQ(){const a=POOL.flatMap(p=>Q.set=='h'?[{...p,t:'h'}]:Q.set=='k'?[{...p,t:'k'}]:[{...p,t:'h'},{...p,t:'k'}]);
const wk=(load().q||{}).w||{},weak=a.filter(x=>wk[x.h]),pool=weak.length&&Math.random()<.35?weak:a;Q.cur=pool[Math.random()*pool.length|0];Q.wait=false;const c=Q.cur;
document.getElementById('qc').innerHTML=Q.mode?c.r+(Q.set=='both'?`<br><small style="font-size:1.2rem">${c.t=='h'?'Hiragana':'Katakana'}</small>`:''):c[c.t];
const i=document.getElementById('qa');i.value='';i.focus();document.getElementById('fb').textContent='';
document.getElementById('sc').textContent=`Đúng ${Q.ok}/${Q.n}`}
function submitQ(){const i=document.getElementById('qa'),fb=document.getElementById('fb'),c=Q.cur;
if(Q.wait){nextQ();return}
const v=i.value.trim().toLowerCase();if(!v)return;
const good=Q.mode?v===c[c.t]:(v===c.r||(ALT[c.r]||[]).includes(v));
Q.n++;upd(o=>{o.q=o.q||{n:0,ok:0,w:{}};o.q.n++;if(good){o.q.ok++;if(o.q.w[c.h]&&--o.q.w[c.h]<=0)delete o.q.w[c.h]}else o.q.w[c.h]=(o.q.w[c.h]||0)+1});
if(good){Q.ok++;fb.className='fb good';fb.textContent='Đúng!';document.getElementById('sc').textContent=`Đúng ${Q.ok}/${Q.n}`;setTimeout(nextQ,450)}
else{fb.className='fb wrong';fb.innerHTML=`Chưa đúng. Đáp án: <b class="jp">${Q.mode?c[c.t]:c.r}</b> — nhấn Enter để tiếp tục`;Q.wait=true;document.getElementById('sc').textContent=`Đúng ${Q.ok}/${Q.n}`}}

/* ---------- 2. TỪ VỰNG (chỉ từ trong tài liệu) ---------- */
// "từ|nghĩa|động từ:nghĩa động từ|kiểu câu"
const mo=["いち","に","さん","し","ご","ろく","しち","はち","く","じゅう","じゅういち","じゅうに"].map((x,i)=>`${x}がつ|tháng ${i+1}`);
const D={
1:[["Chào hỏi & hội thoại","z",["はじめまして|rất vui được gặp (lần đầu)|はじめまして。わたしは ワンです。~Rất vui được gặp. Tôi là Wan.","よろしくおねがいします|rất mong được giúp đỡ|ちゅうごくじんです。よろしく おねがいします。~Tôi là người Trung Quốc. Rất mong được giúp đỡ.","おなまえ|tên (của bạn)|おなまえは？~Tên bạn là gì?","おしごと|nghề nghiệp (của bạn)|おしごとは？ ― わたしは がくせいです。~Nghề của bạn là gì? Tôi là học sinh.","そうですか|vậy à|A：しゅみは すいえいです。 B：そうですか。~A: Sở thích của tôi là bơi lội. B: Vậy à.","はい|vâng|かいしゃいんですか。 ― はい、かいしゃいんです。~Bạn là nhân viên công ty à? Vâng, đúng vậy.","いいえ|không|がくせいですか。 ― いいえ、がくせいじゃ ありません。~Bạn là học sinh à? Không, không phải."]],
["Người & cách gọi","z",["わたし|tôi|わたしは パクです。~Tôi là Park.","～さん|anh/chị (gắn sau tên)|ワンさんは がくせいです。~Anh Wan là học sinh.","～じん|người (nước...)|わたしは ちゅうごくじんです。~Tôi là người Trung Quốc."]],
["Quốc gia","k3",["ベトナム|Việt Nam|j","にほん|Nhật Bản|j","アメリカ|Mỹ|j","イタリア|Ý|j","オーストラリア|Úc","かんこく|Hàn Quốc|j","タイ|Thái Lan|j","ちゅうごく|Trung Quốc|j","ロシア|Nga|j","ブラジル|Brazil"]],
["Nghề nghiệp","i",["がくせい|học sinh, sinh viên","せんせい|giáo viên","きょうし|giáo viên","かいしゃいん|nhân viên công ty","しゃいん|nhân viên (của công ty)","ぎんこういん|nhân viên ngân hàng","いしゃ|bác sĩ"]],
["Trường học","u",["こうこう|trường cấp ba","だいがく|đại học","にほんごがっこう|trường tiếng Nhật"]],
["Sở thích","h",["サッカー|bóng đá","テニス|quần vợt","すいえい|bơi lội","えいが|phim ảnh","おんがく|âm nhạc","りょこう|du lịch","どくしょ|đọc sách","りょうり|nấu ăn","スポーツ|thể thao"]],
["Từ để hỏi","q",["おくに|đất nước (của bạn)||q","たんじょうび|sinh nhật||p","しゅみ|sở thích||n","いつ|khi nào|たんじょうびは いつですか。~Sinh nhật bạn là khi nào?|z","どちら|ở đâu, nước nào|おくには どちらですか。~Nước bạn là nước nào?|z","なん|cái gì|しゅみは なんですか。~Sở thích của bạn là gì?|z"]],
["Tuổi","ag",["いっさい|1 tuổi","はっさい|8 tuổi","じゅっさい|10 tuổi","じゅうにさい|12 tuổi","じゅうごさい|15 tuổi","じゅうはっさい|18 tuổi","はたち|20 tuổi","にじゅういっさい|21 tuổi","にじゅうろくさい|26 tuổi","にじゅうきゅうさい|29 tuổi","さんじゅっさい|30 tuổi"]],
["Tháng","m",mo],
["Ngày trong tháng","dy",["ついたち|ngày 1","ふつか|ngày 2","みっか|ngày 3","よっか|ngày 4","いつか|ngày 5","むいか|ngày 6","なのか|ngày 7","ようか|ngày 8","ここのか|ngày 9","とおか|ngày 10","じゅうよっか|ngày 14","はつか|ngày 20","にじゅうよっか|ngày 24"]]],
2:[["Địa điểm & cửa hàng","b",["インフォメーション|quầy thông tin","ATM|cây ATM","エスカレーター|thang cuốn","エレベーター|thang máy","トイレ|nhà vệ sinh","レジ|quầy thu ngân","スーパー|siêu thị","100えんショップ|cửa hàng đồng giá 100 yên","レストラン|nhà hàng","きっさてん|quán cà phê","きつえんじょ|nơi hút thuốc","ちか|dưới mặt đất","てんいん|nhân viên cửa hàng","くつや|cửa hàng giày","ケーキや|tiệm bánh ngọt","パンや|tiệm bánh mì"]],
["Đồ dùng & quần áo","a",["カメラ|máy ảnh","けいたいでんわ|điện thoại di động","じしょ|từ điển","でんしじしょ|từ điển điện tử","パソコン|máy tính","くつ|giày dép","けしゴム|cục tẩy","ペン|bút mực","トイレットペーパー|giấy vệ sinh","ほん|sách","かばん|túi xách","ズボン|quần dài","Tシャツ|áo thun","とけい|đồng hồ","さいふ|ví"]],

const toH=s=>[...s].map(c=>c>='ァ'&&c<='ヶ'?String.fromCharCode(c.charCodeAt(0)-96):c).join('');
const strip=s=>s.toLowerCase().replace(/[\s。、.,!?！？「」～()（）\-]/g,'');
const ALTW={'しちがつ':['なながつ']};
function wok(v,w){const x=strip(v);if(!x)return false;
for(const e of[w,...(ALTW[w]||[])]){const ee=strip(e);if(toH(x)===toH(ee))return true;
if(/[a-z]/.test(x)&&nrm(x)===nrm(toRo(toH(ee).replace(/ー/g,''))))return true}return false}
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

<div class="grid">${g.map((x,i)=>{const b=T[V.n+'-'+i];return `<button class="glass big" onclick="startTest(${i})">${x[0]}<br><small style="color:var(--mute)">${x[2].length} từ${b?`, điểm cao nhất ${b.best}/10`:''}</small></button>`}).join('')}</div>`)}
function startTest(i){const g=D[V.n][i],seen=new Set(),words=[];
g[2].forEach(e=>{const[w,m]=e.split('|');if(!seen.has(w)){seen.add(w);words.push({w,m,tries:0,rev:false})}});
TS={n:V.n,i,name:g[0],all:words,queue:shuf(words),done:0,total:words.length,first:0,wrong:0,lock:false,cur:null};
show(`<div class="row"><button onclick="testMenu()">← Chủ đề</button></div><div class="glass stage"><p class="sub">${TS.name}: viết hoặc nói từ/câu tiếng Nhật có nghĩa:</p>
<div class="q" id="tm" style="font-size:clamp(1.8rem,7vw,3.2rem);line-height:1.3"></div>
<input id="ta" lang="ja" enterkeyhint="done" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ bằng kana hoặc romaji">
<div class="row" style="justify-content:center"><button onclick="subT()">Kiểm tra</button><button id="mic" onclick="micT()">🎤 Nói</button><button onclick="revT()">Xem đáp án</button><button onclick="skipT()">Bỏ qua</button></div>
<div class="fb" id="tf"></div><p class="sub" id="tp"></p></div>`);
document.getElementById('ta').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)subT()});nextT()}
function prT(){document.getElementById('tp').textContent=`Đã đúng ${TS.done}/${TS.total}`}
function nextT(){TS.lock=false;TS.cur=TS.queue[0];document.getElementById('tm').textContent=TS.cur.m;
const i=document.getElementById('ta');i.value='';i.focus();document.getElementById('tf').textContent='';prT()}
function judge(vals){const cur=TS.cur,c=TS.queue.filter(x=>x.m.toLowerCase()===cur.m.toLowerCase());
for(const v of vals){const h=c.find(x=>wok(v,x.w));if(h)return h}return null}
function resT(hit,heard){if(TS.lock)return;const f=document.getElementById('tf');
if(hit){TS.lock=true;TS.queue.splice(TS.queue.indexOf(hit),1);TS.done++;if(!hit.tries&&!hit.rev)TS.first++;
f.className='fb good';f.innerHTML=`Đúng! <span class="jp">${hit.w}</span>`;prT();setTimeout(TS.done>=TS.total?finT:nextT,700)}
else{TS.cur.tries++;TS.wrong++;f.className='fb wrong';
f.innerHTML='Chưa đúng, thử lại.'+(heard?` Máy nghe được: <span class="jp">${heard}</span>.`:'')+(TS.cur.tries>=2?` Gợi ý: bắt đầu bằng <b class="jp">${[...TS.cur.w.replace('～','')][0]}</b>.`:'')}}
function subT(){const v=document.getElementById('ta').value;if(!v.trim())return;resT(judge([v]))}
function revT(){TS.cur.rev=true;const f=document.getElementById('tf');f.className='fb wrong';
f.innerHTML=`Đáp án: <b class="jp">${TS.cur.w}</b> (${toRo(toH(TS.cur.w.replace('～','')).replace(/ー/g,''))}). Hãy gõ lại để qua câu.`}
function skipT(){TS.cur.tries++;TS.queue.push(TS.queue.shift());nextT()}
function micT(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition,f=document.getElementById('tf'),b=document.getElementById('mic');
if(!SR){f.className='fb wrong';f.textContent='Trình duyệt này không hỗ trợ nhận giọng nói, hãy gõ đáp án.';return}
const r=new SR();r.lang='ja-JP';r.maxAlternatives=5;r.interimResults=false;b.textContent='🎤 Đang nghe...';
r.onresult=e=>{const a=[...e.results[0]].map(x=>x.transcript);resT(judge(a),a[0])};
r.onerror=e=>{f.className='fb wrong';f.textContent='Không nghe được ('+e.error+'). Hãy thử lại hoặc gõ đáp án.'};
r.onend=()=>{b.textContent='🎤 Nói'};try{r.start()}catch{}}
function finT(){const sc=Math.round(TS.first/TS.total*100)/10,weak=TS.all.filter(x=>x.tries||x.rev);
upd(o=>{o.t=o.t||{};const k=TS.n+'-'+TS.i,b=o.t[k]||{best:0,n:0};b.n++;b.best=Math.max(b.best,sc);o.t[k]=b});
show(`<div class="glass stage"><h2>Hoàn thành: ${TS.name}</h2><div class="q" style="font-size:clamp(3rem,12vw,6rem)">${sc}/10</div>
<p>Đã đúng ${TS.total}/${TS.total} từ. Đúng ngay lần đầu: ${TS.first}/${TS.total}. Số lần sai: ${TS.wrong}.</p>
${weak.length?`<h3>Cần ôn lại</h3><p class="jp">${weak.map(x=>`${x.w} (${x.m})`).join('<br>')}</p>`:'<p class="good">Không sai từ nào!</p>'}
<div class="row" style="justify-content:center"><button class="on" onclick="startTest(${TS.i})">Làm lại</button><button onclick="testMenu()">Chọn chủ đề khác</button></div></div>`)}

function roman(t){const M={'。':'.','、':',','！':'!','？':'?'},W={'は':'wa','へ':'e','を':'o','の':'no','と':'to','も':'mo','に':'ni','で':'de','や':'ya','から':'kara','まで':'made','です':'desu','ですか':'desu ka','じゃ':'ja'};
t=t.replace(/[\u4e00-\u9fff]+\{([^}]+)\}/g,'$1').replace(/([。！？、])(?=\S)/g,'$1 ');
return t.split(/(\s+)/).map(c=>{if(!c.trim())return c;const pm=toH(c).match(/^(.*?)([。、！？]*)$/);let y=pm[1],ps=[];
for(let i=0;i<2;i++){if(i&&!['も','は'].includes(ps[0]))break;const m=y.match(/^(.{2,}?)(まで|から|ですか|です|じゃ|は|へ|を|の|と|も|に|で|や)$/);if(!m)break;ps.unshift(m[2]);y=m[1]}

else stop(false)}
function stop(timeout){clearInterval(T.id);const e=(Date.now()-S.t0)/1000;S.run=false;unlock();upd(o=>{o.s=o.s||{n:0,t:0};o.s.n++;o.s.t+=Math.round(Math.min(e,S.limit||e))});
document.getElementById('go').textContent='Bắt đầu';document.getElementById('clk').textContent=mmss(S.limit?S.limit-Math.min(e,S.limit):e);
const r=document.getElementById('res');r.className='fb good';r.textContent=(timeout?'Hết giờ! ':'')+'Thời gian đọc: '+mmss(Math.min(e,S.limit||e))}
/* ---------- 4. LUYỆN ĐẾM SỐ ---------- */
const DAYS=["ついたち","ふつか","みっか","よっか","いつか","むいか","なのか","ようか","ここのか","とおか","じゅういちにち","じゅうににち","じゅうさんにち","じゅうよっか","じゅうごにち","じゅうろくにち","じゅうしちにち","じゅうはちにち","じゅうくにち","はつか","にじゅういちにち","にじゅうににち","にじゅうさんにち","にじゅうよっか","にじゅうごにち","にじゅうろくにち","にじゅうしちにち","にじゅうはちにち","にじゅうくにち","さんじゅうにち","さんじゅういちにち"];
const MONTHS=[["いちがつ"],["にがつ"],["さんがつ"],["しがつ"],["ごがつ"],["ろくがつ"],["しちがつ","なながつ"],["はちがつ"],["くがつ"],["じゅうがつ"],["じゅういちがつ"],["じゅうにがつ"]];
const rnd=n=>Math.random()*n|0;
const dg=['','いち','に','さん','よん','ご','ろく','なな','はち','きゅう'];
function low(n,o4,o7){let s='';const t=n/1000|0,h=n/100%10|0,te=n/10%10|0,u=n%10;
if(t)s+=t==1?'せん':t==3?'さんぜん':t==8?'はっせん':dg[t]+'せん';
if(h)s+=h==1?'ひゃく':h==3?'さんびゃく':h==6?'ろっぴゃく':h==8?'はっぴゃく':dg[h]+'ひゃく';
if(te)s+=te==1?'じゅう':dg[te]+'じゅう';
if(u)s+=u==4?o4:u==7?o7:dg[u];return s}
function reads(n){if(n===0)return['ぜろ','れい'];const m=n/10000|0,r=n%10000,pre=m?low(m,'よん','なな')+'まん':'',set=new Set();
for(const a of['よん','し'])for(const b of['なな','しち'])set.add(pre+(r?low(r,a,b):''));return[...set]}
const H2R={};POOL.forEach(p=>H2R[p.h]=p.r);
function toRo(h){let o='';for(let i=0;i<h.length;i++){const c=h[i];
if(c==='っ'){o+=toRo(h.slice(i+1,i+3))[0];continue}
const sm={'ゃ':'a','ゅ':'u','ょ':'o'}[h[i+1]],sv={'ぁ':'a','ぃ':'i','ぅ':'u','ぇ':'e','ぉ':'o'}[h[i+1]];
if(sv&&H2R[c]){o+=H2R[c].slice(0,-1)+sv;i++}else if(sm){const b=H2R[c].slice(0,-1);o+=(['sh','ch','j'].includes(b)?b:b+'y')+sm;i++}else o+=H2R[c]||c}return o}
const nrm=r=>r.toLowerCase().replace(/[\s\-']/g,'').replace(/nn/g,'n').replace(/shi/g,'si').replace(/chi/g,'ti').replace(/tsu/g,'tu').replace(/fu/g,'hu').replace(/ji/g,'zi').replace(/sh(?=[aueo])/g,'sy').replace(/ch(?=[aueo])/g,'ty').replace(/j(?=[aueo])/g,'zy').replace(/([aiueo])\1/g,'$1');
const same=(v,a)=>{v=v.trim().replace(/\s+/g,'');return /[a-z]/i.test(v)?nrm(v)===nrm(toRo(a)):v===a};
function numGen(max){let n;if(max<=10)n=rnd(11);else if(Math.random()<.05)n=max;
else{const d=1+rnd(String(max).length-1),lo=d==1?0:10**(d-1),hi=10**d-1;n=lo+rnd(hi-lo+1)}
return{q:n.toLocaleString('en-US'),ans:reads(n)}}
const dayGen=()=>{const i=rnd(31);return{q:'Ngày '+(i+1),ans:[DAYS[i]]}};
const moGen=()=>{const i=rnd(12);return{q:'Tháng '+(i+1),ans:MONTHS[i]}};
let N={max:10},Z={};
function counter(){show(`<div class="row"><button onclick="home()">← Menu</button></div><h2>Luyện đếm số</h2>
<div class="grid"><button class="glass big" onclick="days()">Ngày trong tháng</button><button class="glass big" onclick="nums()">Đếm số</button></div>`)}
const cell=(n,r)=>`<div><b>${n}</b>${r}</div>`;
function days(){show(`<div class="row"><button onclick="counter()">← Luyện đếm số</button></div><h2>Ngày trong tháng</h2>
<div class="glass panel"><h3>Tháng</h3><div class="dt jp">${MONTHS.map((m,i)=>cell(i+1,m.join(' / '))).join('')}</div></div>
<div class="glass panel"><h3>Ngày</h3><div class="dt jp">${DAYS.map((d,i)=>cell(i+1,d)).join('')}</div></div>
<div class="row"><button class="on" onclick="zq('Quiz ngày trong tháng',dayGen,'days()')">Quiz ngày</button><button class="on" onclick="zq('Quiz tháng',moGen,'days()')">Quiz tháng</button></div>`)}
function nums(){show(`<div class="row"><button onclick="counter()">← Luyện đếm số</button></div><h2>Đếm số</h2><p class="sub">Chọn khoảng số, xem lại cách đọc rồi bắt đầu quiz.</p>
<div class="row">${[10,100,1000,10000,100000,1000000].map(m=>`<button class="rg ${m==N.max?'on':''}" onclick="N.max=${m};document.querySelectorAll('.rg').forEach(b=>b.classList.toggle('on',b===this))">0 – ${m.toLocaleString('en-US')}</button>`).join('')}</div>
<div class="glass panel jp ref"><p>0 ぜろ／れい　1 いち　2 に　3 さん　4 よん／し　5 ご　6 ろく　7 なな／しち　8 はち　9 きゅう　10 じゅう</p>

function zq(title,gen,back){Z={title,gen,back,cur:null,ok:0,n:0,wait:false};
show(`<div class="row"><button onclick="${back}">← Chọn lại</button></div><div class="glass stage"><p class="sub">${title}</p>
<div class="q jp" id="zc" style="font-size:clamp(2.6rem,12vw,6.5rem)"></div>
<input id="za" lang="ja" enterkeyhint="done" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Gõ cách đọc: hiragana hoặc romaji">
<div class="row" style="justify-content:center"><button onclick="subZ()">Kiểm tra</button><button onclick="revZ()">Xem đáp án</button></div>
<div class="fb" id="zf"></div><p class="sub" id="zs"></p></div>`);
document.getElementById('za').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)subZ()});nextZ()}
function nextZ(){Z.cur=Z.gen();Z.wait=false;document.getElementById('zc').textContent=Z.cur.q;
const i=document.getElementById('za');i.value='';i.focus();document.getElementById('zf').textContent='';
document.getElementById('zs').textContent=`Đúng ${Z.ok}/${Z.n}`}
function recZ(g){Z.n++;if(g)Z.ok++;upd(o=>{o.c=o.c||{n:0,ok:0};o.c.n++;if(g)o.c.ok++});document.getElementById('zs').textContent=`Đúng ${Z.ok}/${Z.n}`}
function revZ(){const a=Z.cur.ans,f=document.getElementById('zf');if(!Z.wait)recZ(false);Z.wait=true;
f.className='fb wrong';f.innerHTML=`Đáp án: <b class="jp">${a[0]}</b> (${toRo(a[0])})${a.length>1?'<br>Cũng đúng: <span class="jp">'+a.slice(1).join(' / ')+'</span>':''}<br><small>Nhấn Enter để tiếp tục</small>`}
function subZ(){if(Z.wait){nextZ();return}const v=document.getElementById('za').value;if(!v.trim())return;
if(Z.cur.ans.some(a=>same(v,a))){recZ(true);const f=document.getElementById('zf');f.className='fb good';f.textContent='Đúng!';setTimeout(nextZ,500)}else revZ()}

function lib(){const L=LIB(),g=id=>document.getElementById(id);
show(`<div class="row"><button onclick="speak()">← Luyện nói</button></div><h2>Kho đoạn văn</h2>

<textarea id="px" rows="7" placeholder="Dán đoạn văn vào đây. Có thể ghi furigana dạng 私{わたし}. Dùng dòng trống để tách nhiều đoạn."></textarea>
<div class="row"><button onclick="g('pf').click()">Tải file .txt</button><input type="file" id="pf" accept=".txt,text/plain" hidden><button onclick="useP()">Luyện ngay</button><button class="on" onclick="saveP()">Lưu vào kho</button></div>
<div class="fb" id="pm"></div></div>
<div class="glass panel"><h3>Danh sách (${L.length})</h3>${L.map((x,i)=>`<div class="pi"><div class="jp pt">${esc(x.n||x.t.replace(/\{[^}]+\}/g,'').slice(0,36)+'...')}<small>${x.u==null?' (có sẵn)':' (của bạn)'}</small></div>
<div class="row" style="margin:6px 0"><button onclick="speak(${i})">Luyện</button>${x.u==null?'':`<button onclick="delP(${x.u})">Xóa</button>`}</div></div>`).join('')}</div>`);
g('pf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{g('px').value=r.result;if(!g('pt').value)g('pt').value=f.name.replace(/\.txt$/i,'')};r.readAsText(f,'utf-8')}}
function msgP(t,ok){const m=document.getElementById('pm');m.className='fb '+(ok?'good':'wrong');m.textContent=t}
function useP(){const v=document.getElementById('px').value.trim();if(!v)return msgP('Hãy dán hoặc tải đoạn văn trước.');speak(v)}
function saveP(){const v=document.getElementById('px').value.trim(),ti=document.getElementById('pt').value.trim();if(!v)return msgP('Hãy dán hoặc tải đoạn văn trước.');
const parts=v.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean);
upd(o=>{o.p=o.p||[];parts.forEach((t,i)=>o.p.push({t,n:ti?(parts.length>1?ti+' '+(i+1):ti):''}))});lib();msgP('Đã lưu '+parts.length+' đoạn vào kho.',1)}
function delP(u){if(confirm('Xóa đoạn văn này?')){upd(o=>{(o.p||[]).splice(u,1)});lib()}}
